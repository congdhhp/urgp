# ─────────────────────────────────────────────────────────────
# URGP Development Environment — Docker Compose
# ─────────────────────────────────────────────────────────────
# Usage: docker compose up -d
# Docs:  docs/05-technical-design.md, ADR-006
# ─────────────────────────────────────────────────────────────

services:
  # ── URGP API (FastAPI Control Plane) ──────────────────────
  urgp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: >
      uvicorn urgp.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      URGP_DATABASE_URL: postgresql+asyncpg://urgp:urgp_dev_password@postgres:5432/urgp
      URGP_RABBITMQ_URL: amqp://urgp:urgp_dev_password@rabbitmq:5672/
      URGP_REDIS_URL: redis://redis:6379/0
      URGP_SMTP_HOST: mailhog
      URGP_SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── URGP Worker (Traceability Hydrator) ──────────────────
  urgp-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: python -m urgp.worker.hydration_worker
    env_file:
      - .env.docker
    environment:
      URGP_DATABASE_URL: postgresql+asyncpg://urgp:urgp_dev_password@postgres:5432/urgp
      URGP_RABBITMQ_URL: amqp://urgp:urgp_dev_password@rabbitmq:5672/
      URGP_REDIS_URL: redis://redis:6379/0
      URGP_SMTP_HOST: mailhog
      URGP_SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped

  # ── PostgreSQL 16 ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: urgp
      POSTGRES_PASSWORD: urgp_dev_password
      POSTGRES_DB: urgp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urgp -d urgp"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── RabbitMQ with Management UI ──────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: urgp
      RABBITMQ_DEFAULT_PASS: urgp_dev_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── MailHog (SMTP mock for notification testing) ─────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
