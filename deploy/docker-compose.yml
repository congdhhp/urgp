name: urgp

# URGP Development Environment

services:
  urgp-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: runtime
    command: >
      uvicorn urgp.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env.docker
    environment:
      URGP_DATABASE_URL: postgresql+asyncpg://urgp:urgp_dev_password@postgres:5432/urgp
      URGP_RABBITMQ_URL: amqp://urgp:urgp_dev_password@rabbitmq:5672/
      URGP_REDIS_URL: redis://redis:6379/0
      URGP_SMTP_HOST: mailhog
      URGP_SMTP_PORT: 1025
      URGP_PORTAL_BASE_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  urgp-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: runtime
    command: python -m urgp.worker.hydration_worker
    env_file:
      - ../backend/.env.docker
    environment:
      URGP_DATABASE_URL: postgresql+asyncpg://urgp:urgp_dev_password@postgres:5432/urgp
      URGP_RABBITMQ_URL: amqp://urgp:urgp_dev_password@rabbitmq:5672/
      URGP_REDIS_URL: redis://redis:6379/0
      URGP_SMTP_HOST: mailhog
      URGP_SMTP_PORT: 1025
      URGP_PORTAL_BASE_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/src:/app/src:ro
    restart: unless-stopped

  urgp-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.portal
      target: runtime
    ports:
      - "5173:80"
    depends_on:
      urgp-api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: urgp
      POSTGRES_PASSWORD: urgp_dev_password
      POSTGRES_DB: urgp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urgp -d urgp"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: urgp
      RABBITMQ_DEFAULT_PASS: urgp_dev_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
