name: URGP CI Pipeline

on:
  push:
    branches: [devel, "feature/*"]
  pull_request:
    branches: [devel]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: backend-poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: backend-poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run ruff linter
        run: poetry run ruff check .

      - name: Run ruff formatter check
        run: poetry run ruff format --check .

  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: backend-poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: backend-poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run mypy
        run: poetry run mypy src/

  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: backend-poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: backend-poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest tests/unit/ -v -m "not integration and not slow" --cov=src/urgp --cov-report=term-missing --cov-fail-under=70
        env:
          URGP_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          URGP_RABBITMQ_URL: amqp://test:test@localhost:5672/
          URGP_REDIS_URL: redis://localhost:6379/0
          URGP_JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pipeline-32chars
          URGP_SIGNING_KEY: test-signing-key-for-ci-pipeline-32-chars
          URGP_API_KEY: test-api-key-for-ci

  cli:
    name: CLI Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: cli-poetry-${{ runner.os }}-${{ hashFiles('cli/poetry.lock') }}
          restore-keys: cli-poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run ruff linter
        run: poetry run ruff check .

      - name: Run ruff formatter check
        run: poetry run ruff format --check .

      - name: Run mypy
        run: poetry run mypy src/

      - name: Run unit tests
        run: poetry run pytest tests/ -v --cov=src/urgp_cli --cov-report=term-missing

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-test, cli, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f deploy/Dockerfile.backend -t urgp-api:ci --target runtime .

      - name: Build portal image
        run: docker build -f deploy/Dockerfile.portal -t urgp-portal:ci --target runtime .

      - name: Verify images
        run: |
          docker inspect urgp-api:ci
          docker inspect urgp-portal:ci
