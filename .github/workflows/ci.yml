name: URGP CI Pipeline

on:
  push:
    branches: [devel, "feature/*"]
  pull_request:
    branches: [devel]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run ruff linter
        run: poetry run ruff check .

      - name: Run ruff formatter check
        run: poetry run ruff format --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run mypy
        run: poetry run mypy src/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest tests/unit/ -v --cov=src/urgp --cov=src/urgp_cli --cov-report=term-missing
        env:
          URGP_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          URGP_RABBITMQ_URL: amqp://test:test@localhost:5672/
          URGP_REDIS_URL: redis://localhost:6379/0
          URGP_JWT_SECRET_KEY: test-jwt-secret-key-for-ci-pipeline-32chars
          URGP_SIGNING_KEY: test-signing-key-for-ci-pipeline-32-chars
          URGP_API_KEY: test-api-key-for-ci

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t urgp-api:ci --target runtime .

      - name: Verify image
        run: docker inspect urgp-api:ci
