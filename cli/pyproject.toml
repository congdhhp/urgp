[tool.poetry]
name = "urgp-cli"
version = "0.1.0"
description = "URGP command-line client for CI/CD release ingestion and verification"
authors = ["URGP Team"]
license = "MIT"
packages = [
    { include = "urgp_cli", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "^2.10.0"
httpx = "^0.28.0"
typer = { version = "^0.15.0", extras = ["all"] }
rich = "^13.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
ruff = ">=0.9.0,<1.0"
mypy = "^1.14.0"
pyinstaller = "^6.11.0"

[tool.poetry.scripts]
urgp-cli = "urgp_cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "TCH001",
    "TCH002",
    "TCH003",
    "RUF022",
]

[tool.ruff.lint.isort]
known-first-party = ["urgp_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
