[tool.poetry]
name = "urgp"
version = "0.1.0"
description = "Universal Release Governance Platform — centralized release governance, traceability, and immutability for software delivery"
authors = ["URGP Team"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "urgp", from = "src" },
    { include = "urgp_cli", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }

# Database
sqlalchemy = { version = "^2.0.0", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.14.0"

# Configuration
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
pyyaml = "^6.0.0"

# Message Broker (RabbitMQ)
aio-pika = "^9.5.0"

# Cache (Redis)
redis = { version = "^5.2.0", extras = ["hiredis"] }

# HTTP Client (for external API calls)
httpx = "^0.28.0"

# CLI
typer = { version = "^0.15.0", extras = ["all"] }

# Logging
structlog = "^24.4.0"

# Utilities
python-multipart = "^0.0.18"

python-jose = {version = "^3.3.0", extras = ["cryptography"]}

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"

# Linting & Formatting
ruff = "^0.9.0"
mypy = "^1.14.0"

# Pre-commit
pre-commit = "^4.0.0"

# Type stubs
types-pyyaml = "^6.0.0"
types-redis = "^4.6.0"

[tool.poetry.scripts]
urgp-api = "urgp.main:run"
urgp-worker = "urgp.worker.hydration_worker:run"
urgp-cli = "urgp_cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ─────────────────────────────────────────────
# Tool Configuration
# ─────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in defaults — required for Typer CLI parameter declarations
    "SIM117",  # nested with — more readable for test patterns
    "TCH001",  # move app import into type-checking block — conflicts with runtime needs
    "TCH002",  # move third-party import into type-checking block — conflicts with runtime needs
    "TCH003",  # move stdlib import into type-checking block — conflicts with runtime needs
    "RUF022",  # __all__ not sorted — we group by category instead
]

[tool.ruff.lint.isort]
known-first-party = ["urgp", "urgp_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "integration: marks tests requiring running services (docker compose)",
    "slow: marks tests that take a long time to run",
]
